name: Update top languages card

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=radical
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true
      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          card_file="$RUNNER_TEMP/top-langs.svg"
          cp profile/top-langs.svg "$card_file"
          git restore --staged --worktree profile/top-langs.svg

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main FETCH_HEAD
            cp "$card_file" profile/top-langs.svg
            git add profile/top-langs.svg

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "Update top languages card"
            if git push origin main; then
              exit 0
            fi
          done

          echo "Could not publish the updated card after three attempts." >&2
          exit 1
